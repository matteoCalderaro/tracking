    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root { --bg: #f7f5f0; --surface: #ffffff; --text: #1a1a1a; --muted: #6b6b6b; --border: #e0ddd6; }
      body { font-family: "DM Sans", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
      .container { max-width: 480px; width: 100%; text-align: center; }
      h1 { font-family: "DM Serif Display", serif; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; margin-bottom: 2rem; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
      .stack { display: grid; gap: 0.75rem; }
      .input { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; font: inherit; background: var(--surface); color: var(--text); }
      .input::placeholder { color: var(--muted); }
      .btn { display: inline-flex; align-items: center; justify-content: center; padding: 14px 28px; border-radius: 10px; font-family: "DM Sans", sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; width: 100%; text-decoration: none; }
      .btn-primary { background: var(--text); color: #fff; border: none; }
      .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
      .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
      .btn-secondary:hover { border-color: var(--text); background: var(--bg); }
      video { width: 100%; display: block; border-radius: 10px; background: #000; }
      .divider { display: flex; align-items: center; gap: 12px; margin: 1rem 0; color: var(--muted); font-size: 13px; }
      .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
      .footer-link { display: inline-block; margin-top: 0.5rem; font-size: 12px; color: var(--muted); }
    </style>
  </head>
